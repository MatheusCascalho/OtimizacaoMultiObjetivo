x-app-environment: &app-environment
  APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Set CELERY_BROKER_URL in .env}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL in .env}
  S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
  TEMPORARY_UPLOAD_TTL_SECONDS: ${TEMPORARY_UPLOAD_TTL_SECONDS:-3600}
  DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-50}
  MAXIMUM_PAGE_SIZE: ${MAXIMUM_PAGE_SIZE:-200}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-5000}

services:
  paretolab:
    build:
      context: ./frontend/mockups
      dockerfile: Dockerfile
    image: paretolab-frontend:local
    ports:
      - "127.0.0.1:${PARETOLAB_PORT:-8080}:8080"
    restart: unless-stopped

  api:
    image: paretolab-app:local
    build:
      context: .
      dockerfile: src/api/Dockerfile
    command:
      - sh
      - -c
      - alembic upgrade head && exec gunicorn --bind 0.0.0.0:5000 'api:create_app()'
    environment: *app-environment
    ports:
      - "127.0.0.1:${PARETOLAB_API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:5000/health/ready", timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker:
    image: paretolab-app:local
    command: ["python", "-m", "worker.run"]
    environment: *app-environment
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      silo:
        condition: service_healthy
      bucket-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  bucket-init:
    image: paretolab-app:local
    command: ["python", "-m", "infrastructure.object_storage.s3.ensure_bucket"]
    environment: *app-environment
    depends_on:
      silo:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  silo:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${SILO_ROOT_USER:?Set SILO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${SILO_ROOT_PASSWORD:?Set SILO_ROOT_PASSWORD in .env}
    volumes:
      - object_storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  object_storage_data:
